<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background: near-white with faint blue -->
    <radialGradient id="bg" cx="512" cy="420" r="580" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#F6F9FF"/>
      <stop offset="100%" stop-color="#E4ECFA"/>
    </radialGradient>

    <!-- T: deep blue, lit from top-left -->
    <radialGradient id="tFill" cx="260" cy="290" r="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#7799FF"/>
      <stop offset="35%"  stop-color="#4466EE"/>
      <stop offset="100%" stop-color="#1A32BB"/>
    </radialGradient>
    <!-- T specular highlight -->
    <radialGradient id="tSpec" cx="230" cy="268" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.55)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- S: cyan-teal, lit from top-right -->
    <radialGradient id="sFill" cx="700" cy="280" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#44E8FF"/>
      <stop offset="40%"  stop-color="#00BFDA"/>
      <stop offset="100%" stop-color="#008FA8"/>
    </radialGradient>
    <!-- S specular highlight -->
    <radialGradient id="sSpec" cx="730" cy="255" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.55)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- Soft shadow for T -->
    <filter id="tShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="12" stdDeviation="22" flood-color="rgba(30,50,200,0.22)"/>
    </filter>
    <!-- Soft shadow for S -->
    <filter id="sShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="12" stdDeviation="22" flood-color="rgba(0,140,170,0.22)"/>
    </filter>
  </defs>

  <!-- ── Background ── -->
  <rect width="1024" height="1024" rx="210" fill="url(#bg)"/>

  <!-- Subtle inner vignette ring -->
  <rect width="1024" height="1024" rx="210" fill="none"
        stroke="rgba(180,200,240,0.30)" stroke-width="2"/>

  <!-- ══ T LETTER (behind S) ══ -->
  <g filter="url(#tShadow)">
    <!-- T crossbar: wide pill -->
    <rect x="98" y="248" width="512" height="122" rx="61"
          fill="url(#tFill)" opacity="0.93"/>
    <!-- T vertical stem -->
    <rect x="293" y="248" width="122" height="572" rx="61"
          fill="url(#tFill)" opacity="0.93"/>
    <!-- Specular on T crossbar -->
    <rect x="98" y="248" width="512" height="122" rx="61"
          fill="url(#tSpec)"/>
    <!-- Specular on T stem -->
    <rect x="293" y="248" width="122" height="572" rx="61"
          fill="url(#tSpec)"/>
  </g>

  <!-- ══ S LETTER (in front, slightly overlapping) ══ -->
  <g filter="url(#sShadow)">
    <!-- S base stroke -->
    <path d="
      M 710,322
      C 712,238 650,192 560,198
      C 445,206 362,292 395,408
      C 416,476 504,506 566,536
      C 648,574 688,630 656,696
      C 630,746 564,774 484,764
      C 424,756 385,724 364,690
    "
      fill="none"
      stroke="url(#sFill)"
      stroke-width="122"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.93"/>
    <!-- S specular overlay -->
    <path d="
      M 710,322
      C 712,238 650,192 560,198
      C 445,206 362,292 395,408
      C 416,476 504,506 566,536
      C 648,574 688,630 656,696
      C 630,746 564,774 484,764
      C 424,756 385,724 364,690
    "
      fill="none"
      stroke="url(#sSpec)"
      stroke-width="122"
      stroke-linecap="round"
      stroke-linejoin="round"/>
  </g>
</svg>
